name: 刷新 GitHub 清单

on:
  schedule:
    # 每三天 02:17 UTC（北京时间 10:17）
    - cron: "17 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh READMEs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_catalog.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md data/candidates.json
          if git diff --staged --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: 按 GitHub 数据刷新 AIGC 清单"
            git push
          fi
